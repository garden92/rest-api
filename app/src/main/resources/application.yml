spring:
  application:
    name: semicolon-api

  profiles:
    active: local

  main:
    banner-mode: console

  webflux:
    base-path: /

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

  # ✅ 로컬 기본(H2 in-mem) — R2DBC와 Flyway가 "같은 DB" + "같은 옵션"을 써야 함
  r2dbc:
    url: r2dbc:h2:mem:///testdb?options=DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    pool:
      initial-size: 2
      max-size: 10
      max-idle-time: 10m
      max-acquire-time: 3s
      validation-query: SELECT 1

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    user: sa
    password:

  # ✅ SQL init 끄기(충돌 방지)
  sql:
    init:
      mode: never

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    disable-swagger-default-url: true
  api-docs:
    path: /api-docs
  show-actuator: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
      base-path: /actuator
  endpoint:
    health:
      show-details: always

logging:
  config: classpath:logback-spring-${spring.profiles.active}.xml

# JWT 설정
jwt:
  secret: ${JWT_SECRET:mySecretKeyForDevlopmentPurposesOnly12345678901234567890}
  expiration: ${JWT_EXPIRATION:86400} # 24시간 (초 단위)

---
spring:
  config:
    activate:
      on-profile: dev

  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:koldb_dev}
    username: ${DB_USERNAME:koluser}
    password: ${DB_PASSWORD:kolpass}
    pool:
      initial-size: 5
      max-size: 20
      max-idle-time: 10m
      max-acquire-time: 5s
      validation-query: SELECT 1

  flyway:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:koldb_dev}
    user: ${DB_USERNAME:koluser}
    password: ${DB_PASSWORD:kolpass}
    locations: classpath:db/migration
    baseline-on-migrate: true
---
spring:
  config:
    activate:
      on-profile: test
  # ✅ 테스트도 동일 옵션 유지(끊김 방지)
  r2dbc:
    url: r2dbc:h2:mem:///testdb?options=DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  flyway:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    user: sa
    password:
---
spring:
  config:
    activate:
      on-profile: prod

  # ✅ 운영은 Postgres로
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:koldb}
    username: ${DB_USERNAME:koluser}
    password: ${DB_PASSWORD:kolpass}
    pool:
      initial-size: 10
      max-size: 50
      max-idle-time: 5m
      max-acquire-time: 10s
      validation-query: SELECT 1

  flyway:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:koldb}
    user: ${DB_USERNAME:koluser}
    password: ${DB_PASSWORD:kolpass}
    locations: classpath:db/migration
    # 운영 보호 옵션(원하면)
    # clean-disabled: true
    # baseline-on-migrate: true
